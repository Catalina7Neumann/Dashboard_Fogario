<style>
*,*::before,*::after{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}
html,body{margin:0;padding:0;background:#D8D7CD;font-family:'Onest','Segoe UI','Helvetica Neue',Arial,sans-serif;color:#1A1A1A}
body{padding:14px 22px 16px;min-height:100vh;display:flex;flex-direction:column}
.topbar{display:flex;justify-content:space-between;align-items:flex-end;max-width:1400px;width:100%;margin:0 auto 12px;gap:18px;flex-wrap:wrap}
.brand{line-height:1}
.brand .name{font-weight:800;font-size:26px;letter-spacing:.04em;color:#1A1A1A;display:block}
.brand .sub{font-size:11px;color:#1A1A1A;font-weight:600;letter-spacing:.02em;display:block;margin-top:3px}
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{background:#fff;border:none;color:#1A1A1A;font-family:inherit;font-weight:600;font-size:12px;padding:8px 14px;border-radius:20px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.btn:hover{background:#f5f5f0}
.btn.primary{background:#4ECC50}.btn.primary:hover{background:#43b045}
.nav{display:flex;gap:6px;max-width:1400px;width:100%;margin:0 auto 12px;flex-wrap:wrap;background:#fff;padding:5px;border-radius:14px}
.nav button{flex:1;text-align:center;padding:8px 12px;border-radius:10px;color:#4A4A48;cursor:pointer;font-weight:600;font-size:13px;transition:.15s;border:none;background:none;font-family:inherit}
.nav button:hover{background:#f5f5f0}
.nav button.active{background:#4ECC50;color:#1A1A1A}
.pages{max-width:1400px;width:100%;margin:0 auto;flex:1}
.page{background:#E6E5DC;border-radius:18px;padding:18px 24px 20px;position:relative;overflow:hidden;display:none;flex-direction:column;min-height:560px}
.page.active{display:flex}
.page::before{content:'';position:absolute;top:-90px;left:-90px;width:170px;height:170px;background:#3D6FB8;border-radius:50%;z-index:0}
.page::after{content:'';position:absolute;bottom:-90px;right:-90px;width:170px;height:170px;background:#4ECC50;border-radius:50%;opacity:.85;z-index:0}
.page>*{position:relative;z-index:1}
.content{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;min-height:0}
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.tag{display:inline-block;background:#4ECC50;color:#1A1A1A;font-weight:700;font-size:12px;padding:6px 14px;border-radius:22px}
.head .brand{text-align:right}
.head .brand .name{font-size:18px}
.head .brand .sub{font-size:10px;margin-top:2px}
.title{font-size:24px;font-weight:700;line-height:1.15;margin:2px 0 12px;color:#1A1A1A}
.title .ac{color:#4ECC50}
.grid{display:grid;gap:10px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.card{background:#fff;border-radius:14px;padding:12px 15px;box-shadow:0 1px 3px rgba(0,0,0,.06);display:flex;flex-direction:column;min-height:78px}
.lbl{font-size:12.5px;color:#1A1A1A;font-weight:600;line-height:1.25}
.num{font-size:26px;font-weight:700;line-height:1.05;margin-top:auto;white-space:nowrap}
.sub{font-size:11px;color:#4A4A48;margin-top:3px;line-height:1.3}
/* Héroes P1 */
.chip-ac{display:inline-block;background:#dfe3d9;color:#4A4A48;font-size:11px;font-weight:600;padding:4px 13px;border-radius:14px;margin-bottom:12px}
.hero{border-radius:15px;padding:16px 20px;display:flex;flex-direction:column}
.hero.res{background:#e9f1fa;border:2px solid #3D6FB8;justify-content:center;gap:2px}
.hero.res .hl{font-size:13px;font-weight:700;color:#265490}
.hero.res .hn{font-size:44px;font-weight:800;color:#3D6FB8;line-height:1}
.hero.res .hcap{font-size:12px;font-weight:600;color:#265490;margin-top:8px}
.hero.res .hbig{font-size:38px;font-weight:800;color:#3D6FB8;line-height:1}
.hero.gest{background:#eef7ea;border:2px solid #4ECC50;gap:7px}
.hero.gest .hl{font-size:12px;font-weight:700;color:#1F7A24}
.hero.gest .hn{font-size:31px;font-weight:800;color:#1F9A2C;line-height:1.05}
.hero.gest .hsub{font-size:10.5px;color:#2E8B31}
.comp{display:flex;justify-content:space-between;align-items:center;background:#fff;border-radius:9px;padding:9px 13px;font-size:12px}
.comp .v{font-weight:800}
.canal-box{background:rgba(255,255,255,.55);border-radius:13px;padding:12px 15px}
.canal{background:#fff;border-radius:11px;padding:11px 14px}
.canal .n{font-size:24px;font-weight:800;line-height:1;margin-top:6px}
.canal.ph{border:1px dashed #b7b7ae}
.canal.ph .n{color:#9a9a90}
.canal.hito{background:#f3faf0;border:2px solid #6ac64f;position:relative}
.canal.hito .n{color:#4e9e38}
.badge-hito{position:absolute;top:11px;right:13px;background:#6ac64f;color:#0f2e07;font-size:10px;font-weight:800;padding:3px 9px;border-radius:14px;letter-spacing:.4px}
/* Tarjetas con foto (P3) */
.rcard{position:relative;border-radius:14px;overflow:hidden;padding:14px 16px;display:flex;flex-direction:column;color:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12);background-size:cover;background-position:center;print-color-adjust:exact;-webkit-print-color-adjust:exact}
.rcard::before{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(10,30,60,.30),rgba(10,30,60,.62));z-index:0}
.rcard>*{position:relative;z-index:1}
.rcard .n,.rcard .mo,.rcard .nm,.rcard .sub{text-shadow:0 1px 3px rgba(0,0,0,.55)}
.rcard .rtop{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.rcard .rico{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff}
.rcard .n{font-size:36px;font-weight:800;line-height:1}
.rcard .mo{margin-left:auto;font-size:15px;font-weight:800;color:#8FE36A;white-space:nowrap}
.rcard .nm{font-size:14px;font-weight:700;margin-top:2px}
.rcard .rbar{height:9px;border-radius:5px;background:rgba(255,255,255,.28);margin-top:10px}
.rcard .rbar i{display:block;height:9px;border-radius:5px;background:#4ECC50}
.rcard .sub{font-size:11px;color:rgba(255,255,255,.92);margin-top:7px;font-weight:500}
/* Barras P2 */
.bar-row{display:grid;grid-template-columns:118px 1fr 52px;align-items:center;gap:9px;font-size:12px;margin-bottom:11px}
.bar-row .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-track{height:15px;border-radius:4px;min-width:2px}
.bar-track.g{background:#4ECC50}
.bar-track.b{background:#3D6FB8}
.bar-row .v{text-align:right;font-weight:700}
.tot-row{margin-top:auto;padding-top:9px;border-top:1px solid #e3e1d7;display:flex;justify-content:space-between;font-weight:800;font-size:13px}
/* chips objetivo / zonas */
.chip-obj{background:rgba(255,255,255,.6);border:1px solid rgba(61,111,184,.25);border-radius:12px;padding:11px 13px}
.chip-obj .n{font-size:22px;font-weight:800;color:#3D6FB8;line-height:1}
.chip-obj .t{font-size:10.5px;color:#1A1A1A;font-weight:600;margin-top:3px;line-height:1.2}
.chip-obj .cm{font-size:10px;color:#4A4A48;margin-top:2px}
.cardh{cursor:default;transition:background .12s}
.grp .pnl{columns:2;column-gap:14px;font-size:9.5px;line-height:1.6}
.grp .pn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;break-inside:avoid}
/* P3 grupos */
.grp{background:#fff;border-radius:12px;padding:11px 14px;break-inside:avoid;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.grp h4{margin:0 0 8px;font-size:13px;font-weight:700;display:flex;justify-content:space-between;border-bottom:2px solid #4ECC50;padding-bottom:5px}
.grp h4 .c{color:#3D6FB8}
.grp ul{margin:0;padding:0;list-style:none;columns:2;column-gap:22px}
.grp li{display:flex;justify-content:space-between;gap:10px;font-size:11px;padding:2.5px 0;break-inside:avoid}
.grp li .m{font-weight:700;white-space:nowrap}
.grp li span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* mapa */
.map-grid{display:grid;grid-template-columns:1fr 220px;gap:12px;flex:1;min-height:0}
.map-card-w{background:#fff;border-radius:14px;padding:12px;display:flex;align-items:center;justify-content:center;position:relative}
.map-wrap{position:relative;width:100%;aspect-ratio:1024/576;max-height:100%;background:url('Mapa Rio Negro.png') center/contain no-repeat;border-radius:10px;box-shadow:inset 0 0 60px rgba(0,0,0,.04)}
.prov{position:absolute;font-size:10.5px;font-weight:600;color:#A8A79F;letter-spacing:.06em;pointer-events:none;text-transform:uppercase;z-index:1}
.prov.v{writing-mode:vertical-rl;letter-spacing:.12em}
.pin{position:absolute;transform:translate(-50%,-100%);cursor:pointer;z-index:2;line-height:0}
.pin svg.mark{width:24px;height:32px;display:block;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35));transition:transform .15s}
.pin:hover svg.mark{transform:scale(1.18)}
.pin:hover{z-index:60}
.pop{display:none;position:absolute;left:12px;bottom:calc(100% + 4px);background:#1A1A1A;color:#fff;border-radius:12px;padding:11px 14px;min-width:200px;box-shadow:0 10px 28px rgba(0,0,0,.45);z-index:80;text-align:left;font-size:11.5px;line-height:1.45}
.pop::after{content:'';position:absolute;top:100%;left:18px;border:6px solid transparent;border-top-color:#1A1A1A}
.pin.up .pop{bottom:auto;top:calc(100% + 4px)}
.pin.up .pop::after{top:auto;bottom:100%;border-top-color:transparent;border-bottom-color:#1A1A1A}
.pin.right .pop{left:auto;right:12px}.pin.right .pop::after{left:auto;right:18px}
.pin:hover .pop{display:block}
.pop h5{margin:0 0 6px;font-size:13px;font-weight:700;color:#fff}
.pop .r{color:#4ECC50;font-weight:700}
.map-side{display:flex;flex-direction:column;gap:9px;min-height:0}
.zonas{display:flex;flex-direction:column;gap:8px}
.zchip{background:#e9f1fa;border:1px solid rgba(61,111,184,.3);border-radius:11px;padding:9px 13px;display:flex;justify-content:space-between;align-items:center}
.zchip .zn{font-size:12px;font-weight:600;color:#265490}
.zchip .zv{font-size:18px;font-weight:800;color:#3D6FB8}
.zchip.tot{background:#3D6FB8}.zchip.tot .zn,.zchip.tot .zv{color:#fff}
.ref{background:#fff;border-radius:12px;padding:9px 14px;font-size:11px;color:#4A4A48;display:flex;align-items:center;gap:8px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.ref .d{width:9px;height:9px;border-radius:50%;background:#A8A79F;flex-shrink:0}
/* donas P5 */
.dn-wrap{display:flex;flex-direction:column;align-items:center;flex:1}
.dn-svg{filter:drop-shadow(0 4px 8px rgba(26,26,26,.12))}
.dn-svg circle.slice{transition:opacity .15s,stroke-width .15s;cursor:pointer}
.dn-svg:hover circle.slice{opacity:.5}
.dn-svg circle.slice:hover{opacity:1;stroke-width:8.5}
.dn-tip{position:fixed;background:#1A1A1A;color:#fff;padding:8px 12px;border-radius:8px;font-size:11.5px;font-weight:500;pointer-events:none;display:none;white-space:nowrap;z-index:9998;line-height:1.4;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.dn-tbl{width:100%;font-size:12px;border-collapse:collapse;margin-top:12px}
.dn-tbl td{padding:5px 0}
.dn-tbl tr+tr td{border-top:1px solid #f0eee5}
.dot-leg{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:7px;vertical-align:middle}
/* P6 evolutivo */
.ev-h .bar-row{grid-template-columns:60px 1fr 52px;margin-bottom:9px}
.vbars{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:16px;border-bottom:2px solid #e3e1d7}
.vbar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.vbar .vv{font-size:9px;color:#4A4A48;font-weight:700;margin-bottom:2px}
.vbar .vb{width:66%;background:#1F9A2C;border-radius:3px 3px 0 0;min-height:2px}
.vbar .vt{font-size:9px;color:#4A4A48;margin-top:3px}
.big-num{font-size:30px;font-weight:800;color:#1F9A2C;line-height:1}
@media (max-width:820px){
  .nav{flex-direction:column}.nav button{flex:none}
  .grid.g4,.grid.g3{grid-template-columns:1fr 1fr}
  .split{grid-template-columns:1fr!important}
  .map-grid{grid-template-columns:1fr!important}
  .map-wrap{aspect-ratio:1024/620}
  .grp ul{columns:1}
  .hero.res .hn{font-size:42px}
}
@media print{
  @page{size:A4 landscape;margin:0}
  html,body{height:auto;background:#fff;margin:0;padding:0}
  body{padding:0;margin:0;display:block}
  .topbar,.nav,.btn{display:none !important}
  .pages{max-width:none;width:auto;margin:0;padding:0;flex:none}
  /* Cada página = exactamente una hoja A4 apaisada, tamaño fijo */
  .page{
    display:flex !important;flex-direction:column;
    width:297mm;height:208mm;
    margin:0;border-radius:0;padding:9mm 12mm;
    background:#E6E5DC !important;
    overflow:hidden;
    page-break-after:always;break-after:page;
    page-break-inside:avoid;break-inside:avoid;
  }
  .page:last-child{page-break-after:auto;break-after:auto}
  .content{flex:1;min-height:0}
  .pin .pop{display:none !important}
  .grp{break-inside:avoid}
  .map-grid{grid-template-columns:1fr 220px !important}
  /* P3 detalle (151 nombres): compactar para que entren en una hoja */
  #p3 .content{gap:5px}
  #p3 .chip-obj{padding:7px 10px}
  #p3 .chip-obj .n{font-size:17px}
  #p3 .grp{padding:7px 10px}
  #p3 .grp h4{font-size:10.5px;margin-bottom:4px;padding-bottom:4px}
  #p3 .grp .pnl{font-size:7.5px;line-height:1.32;column-gap:10px}
  #p3 .grp li{font-size:8px;padding:1.5px 0}
}
</style>

function locLabel(n){return n==='CABA'?'CABA (fuera de RN)':esc(n);}
function barChart(items,cls){

    '<span style="display:block"><span style="display:block;height:11px;border-radius:3px;background:'+col+';width:'+Math.max(2,it[1]/max*100)+'%"></span></span>'+
    '<span style="text-align:right;font-weight:700">'+fmtM0(it[1])+'</span></div>').join('');
}

const MARK='<svg class="mark" viewBox="0 0 24 32"><path fill="#1A1A1A" d="M12 0C5.4 0 0 5.4 0 12c0 9 12 20 12 20s12-11 12-20C24 5.4 18.6 0 12 0z M12 7.5a4.5 4.5 0 1 0 0 9 4.5 4.5 0 0 0 0-9z"/></svg>';
const ALTO_VALLE={"Cipolletti":1,"General Roca":1,"Cinco Saltos":1,"Allen":1,"Fernández Oro":1,"Villa Regina":1};
function P4(){
  const d=DATA.p4;
  const valle=d.localidades.filter(l=>ALTO_VALLE[l[0]]);
  const otras=d.localidades.filter(l=>!ALTO_VALLE[l[0]] && COORDS[l[0]]);
  const pins=[];
  if(valle.length){const m=valle.reduce((s,l)=>s+l[1],0),c=valle.reduce((s,l)=>s+l[2],0),p=proj(-38.97,-67.70);
    pins.push({n:'Alto Valle',x:p.x,y:p.y,m:m,c:c,inc:valle.map(l=>l[0])});}
  otras.forEach(l=>{const co=COORDS[l[0]],p=proj(co.lat,co.lon);pins.push({n:l[0],x:p.x,y:p.y,m:l[1],c:l[2],inc:null});});
  let html='';
  pins.forEach(p=>{
    const right=p.x>66, cls='pin'+(p.y<26?' up':'')+(right?' right':'');
    const lbl='position:absolute;'+(right?'right:28px':'left:28px')+';top:2px;background:#fff;padding:4px 10px;border-radius:9px;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.18);line-height:1.15';
    const inc=p.inc?'<div style="font-size:10px;color:#B6E3A2;margin:2px 0 6px;font-weight:600">Incluye: '+p.inc.map(esc).join(', ')+'</div>':'';
    html+='<div class="'+cls+'" style="left:'+p.x+'%;top:'+p.y+'%">'+MARK+
      '<span style="'+lbl+'"><span style="color:#1F9A2C;font-weight:800;font-size:12.5px">'+fmtM0(p.m)+' M$</span> <span style="color:#3D6FB8;font-weight:700;font-size:11.5px">· '+p.c+' res</span></span>'+
      '<div class="pop"><h5>'+esc(p.n)+'</h5>'+inc+
      '<div style="display:flex;justify-content:space-between;gap:18px"><span>Monto resoluciones</span><b style="color:#4ECC50">'+fmtM(p.m)+'</b></div>'+
      '<div style="display:flex;justify-content:space-between;gap:18px"><span>Resoluciones</span><b style="color:#7AA8E0">'+p.c+'</b></div></div></div>';
  });
  const zt=d.zonas.reduce((s,z)=>s+z[1],0);
  const zrows=d.zonas.map((z,i)=>'<div style="display:flex;justify-content:space-between;align-items:center;'+(i<d.zonas.length-1?'border-bottom:1px solid #efece2;':'')+'padding:9px 0"><span style="font-size:12px;font-weight:600;color:#265490">'+esc(z[0])+'</span><span style="font-size:20px;font-weight:800;color:#3D6FB8">'+z[1]+'</span></div>').join('');
  return '<section class="page" id="p4">'+head('Página 4 · Abordaje territorial','Abordaje','territorial')+
  '<div class="content"><div class="map-grid">'+
    '<div class="map-card-w"><div class="lbl" style="position:absolute;top:10px;left:14px;z-index:3">Localidades alcanzadas con resolución · gestión territorial</div>'+
      '<div class="map-wrap" id="map"><span class="prov" style="left:6%;top:36%">Neuquén</span><span class="prov" style="left:44%;top:1%">La Pampa · Bs. As.</span><span class="prov" style="left:42%;bottom:2%">Chubut</span><span class="prov v" style="right:1%;top:44%">Mar Argentino</span>'+html+'</div></div>'+
    '<div class="map-side"><div class="card" style="flex:1;padding:14px 15px"><div class="lbl" style="margin-bottom:4px">Resoluciones por zona</div><div style="display:flex;flex-direction:column;justify-content:space-between;flex:1">'+zrows+'</div><div style="display:flex;justify-content:space-between;align-items:center;background:#3D6FB8;color:#fff;border-radius:10px;padding:10px 13px;margin-top:8px"><span style="font-size:12px;font-weight:700">Total</span><span style="font-size:20px;font-weight:800">'+zt+'</span></div></div></div>'+
  '</div>'+
  '<div class="ref" style="margin-top:10px"><span class="d"></span><span><b>Referencia:</b> las localidades corresponden a las resoluciones · PyMEs que operan en Río Negro.</span></div>'+
  '</div></section>';
}

/* ---------------- PÁGINA 5 · DONAS ---------------- */
const PALETTE=['#1F9A2C','#4ECC50','#3D6FB8','#7AA8E0','#888780','#B6E3A2','#9FE1CB','#F0997B','#D85A30'];
function pctsRound(items,total){const raw=items.map(it=>it[1]/total*100);const fl=raw.map(r=>Math.floor(r));let diff=100-fl.reduce((a,b)=>a+b,0);const rem=raw.map((r,i)=>({i,f:r-fl[i]})).sort((a,b)=>b.f-a.f);const o=fl.slice();for(let k=0;k<diff;k++)o[rem[k].i]++;return o;}
function P5(){
  return '<section class="page" id="p6">'+head('Página 6 · Garantías otorgadas','Garantías','otorgadas')+
  '<div class="content"><div class="grid g3" style="flex:1">'+
    donaCard('Por Comercial','dn-com','tb-com')+
    donaCard('Por Sector Económico','dn-sec','tb-sec')+
    donaCard('Por Tamaño de PyME','dn-tam','tb-tam')+
  '</div></div></section>';
}
function donaCard(t,dn,tb){return '<div class="card" style="align-items:center"><div class="lbl" style="align-self:flex-start">'+t+'</div><div class="dn-wrap"><div id="'+dn+'" style="margin:10px 0 4px"></div></div><table class="dn-tbl" id="'+tb+'"></table></div>';}
function buildDona(items,el){
  const total=items.reduce((s,i)=>s+i[1],0)||1;const pcts=pctsRound(items,total);let off=0,segs='';
  items.forEach((it,i)=>{const rp=it[1]/total*100;const col=PALETTE[i]||'#888780';
    segs+='<circle class="slice" cx="21" cy="21" r="15.915" fill="transparent" stroke="'+col+'" stroke-width="7" stroke-dasharray="'+rp.toFixed(3)+' '+(100-rp).toFixed(3)+'" stroke-dashoffset="'+(-off).toFixed(3)+'" transform="rotate(-90 21 21)" data-name="'+esc(it[0])+'" data-val="'+it[1]+'" data-pct="'+pcts[i]+'"></circle>';off+=rp;});
  el.innerHTML='<svg class="dn-svg" width="190" height="190" viewBox="0 0 42 42"><circle cx="21" cy="21" r="15.915" fill="transparent" stroke="#E6E5DC" stroke-width="7"></circle>'+segs+'</svg>';
  return pcts;
}
function buildTabla(items,pcts,tbl){tbl.innerHTML=items.map((it,i)=>'<tr><td><span class="dot-leg" style="background:'+(PALETTE[i]||'#888780')+'"></span>'+esc(it[0])+'</td><td style="text-align:right;font-weight:700">'+it[1]+'</td><td style="text-align:right;color:#4A4A48;width:46px">'+pcts[i]+'%</td></tr>').join('');}

/* ---------------- PÁGINA 6 · EVOLUTIVOS ---------------- */
function hEvol(items,color){
  const max=Math.max.apply(null,items.map(i=>i[1]))||1;
  return items.map(it=>'<div class="bar-row"><span class="nm">'+esc(it[0])+'</span><div class="bar-track" style="background:'+color+';width:'+Math.max(2,it[1]/max*100)+'%"></div><span class="v">'+fmtM0(it[1])+'</span></div>').join('');
}
const CY2=DATA.fecha_corte.slice(-2), CY4=DATA.fecha_corte.slice(-4);
function splitYear(items){return {act:items.filter(i=>String(i[0]).trim().endsWith(CY2)), full:items};}
function evolCard(titulo,items,color,totLbl,totVal,key){
  const s=splitYear(items);
  return '<div class="card"><div style="display:flex;justify-content:space-between;align-items:baseline"><div class="lbl">'+titulo+'</div><span class="sub" style="margin:0">Año en curso '+CY4+'</span></div>'+
    '<div id="'+key+'-act" style="margin-top:10px">'+hEvol(s.act,color)+'</div>'+
    '<div id="'+key+'-full" style="display:none;margin-top:10px">'+hEvol(s.full,color)+'</div>'+
    '<button class="linkish" onclick="togEv(\''+key+'\',this)">Ver período completo (incl. '+(CY4-1)+') ▾</button>'+
    '<div class="tot-row"><span>'+totLbl+'</span><span>'+fmtM(totVal)+'</span></div></div>';
}
function P6(){
  const d=DATA.p6;const max=Math.max.apply(null,d.rendimientos.map(i=>i[1]))||1;
  const vb=d.rendimientos.map(it=>'<div class="vbar"><div class="vv">'+fmtM0(it[1])+'</div><div class="vb" style="height:'+Math.max(3,Math.round(it[1]/max*118))+'px"></div><div class="vt">'+esc(it[0])+'</div></div>').join('');
  return '<section class="page" id="p7">'+head('Página 7 · Sostenibilidad','Indicadores','de evolución')+

   '<div class="grid" style="grid-template-columns:1fr 1fr;margin-bottom:11px;align-items:start">'+
     evolCard('Evolución comisiones · facturadas (M$)',d.comisiones,'#4ECC50','Total período',d.com_total,'com')+

   '</div>'+

     '<div class="vbars">'+vb+'</div></div>'+
  '</div></section>';
}

/* ---------------- PÁGINA 5 · GESTIÓN DE MORA ---------------- */
function PMora(){
  const d=DATA.p_mora;
  const kpis=
    '<div class="card"><div class="lbl">Mora</div><div class="num" style="color:#3D6FB8">'+fmtNum(d.mora_pct)+'%</div></div>'+
    '<div class="card"><div class="lbl">Afrontado</div><div class="num" style="color:#3D6FB8">'+fmtM(d.afrontado)+'</div></div>'+
    '<div class="card"><div class="lbl">Recuperos / Honramientos</div><div class="num" style="color:#1F9A2C">'+fmtM(d.recuperado)+'</div></div>'+
    '<div class="card"><div class="lbl">Intereses facturados</div><div class="num" style="color:#1F9A2C">'+fmtFull(d.intereses)+'</div></div>'+
    '<div class="card"><div class="lbl">Saldo pendiente de recupero</div><div class="num">'+fmtM(d.saldo)+'</div></div>';
  const maxE=Math.max.apply(null,d.evol.map(x=>Math.max(x[1],x[2])))||1;
  const plotTop=Math.max(5e6,Math.ceil(maxE/5e6)*5e6);
  let gl='';
  for(let v=5e6;v<=plotTop+1;v+=5e6){gl+='<div style="position:absolute;left:0;right:0;bottom:'+(v/plotTop*100)+'%;border-top:1px dashed #d9d7cd"><span style="position:absolute;left:-40px;top:-7px;font-size:9px;color:#9a988f;font-weight:600;width:34px;text-align:right">$'+(v/1e6)+'M</span></div>';}
  const vbars=d.evol.map(x=>'<div class="mev" data-n="'+esc(x[0])+'" data-a="'+x[1]+'" data-r="'+x[2]+'" style="flex:1;display:flex;align-items:flex-end;gap:4px;justify-content:center;height:100%">'+
    '<div style="width:30%;max-width:22px;background:#3D6FB8;border-radius:3px 3px 0 0;min-height:1px;height:'+(x[1]/plotTop*100)+'%"></div>'+
    '<div style="width:30%;max-width:22px;background:#4ECC50;border-radius:3px 3px 0 0;min-height:1px;height:'+(x[2]/plotTop*100)+'%"></div></div>').join('');
  const vmonths=d.evol.map(x=>'<div style="flex:1;text-align:center;font-size:11px;color:#4A4A48;font-weight:600">'+esc(x[0])+'</div>').join('');
  const maxA=Math.max.apply(null,d.acreedor.map(a=>Math.max(a[1],a[2])))||1;
  const accr=d.acreedor.map(a=>'<div style="margin-bottom:22px">'+
    '<div style="font-size:14px;font-weight:700;margin-bottom:10px">'+esc(a[0])+'</div>'+
    '<div style="display:grid;grid-template-columns:82px 1fr 78px;align-items:center;gap:10px;margin-bottom:8px"><span style="font-size:12px;color:#4A4A48;font-weight:600">Afrontado</span><span style="display:block;height:16px;border-radius:4px;background:#3D6FB8;width:'+Math.max(2,a[1]/maxA*100)+'%"></span><span style="font-size:12px;font-weight:700;text-align:right">'+fmtM(a[1])+'</span></div>'+
    '<div style="display:grid;grid-template-columns:82px 1fr 78px;align-items:center;gap:10px"><span style="font-size:12px;color:#4A4A48;font-weight:600">Recuperado</span><span style="display:block;height:16px;border-radius:4px;background:#4ECC50;width:'+Math.max(2,a[2]/maxA*100)+'%"></span><span style="font-size:12px;font-weight:700;text-align:right">'+fmtM(a[2])+'</span></div></div>').join('');
  const maxS=Math.max.apply(null,d.sector.map(s=>s[1]))||1, totS=d.sector.reduce((s,x)=>s+x[1],0)||1;
  const sb=d.sector.map((s,i)=>'<div class="vbar msec" data-n="'+esc(s[0])+'" data-v="'+s[1]+'" style="justify-content:flex-end">'+
    '<div style="font-size:15px;font-weight:800;color:#1A1A1A;margin-bottom:6px">'+Math.round(s[1]/totS*100)+'%</div>'+
    '<div style="width:50%;max-width:54px;background:'+(i===0?'#2a5080':'#3D6FB8')+';border-radius:4px 4px 0 0;min-height:3px;height:'+Math.max(4,Math.round(s[1]/maxS*120))+'px"></div>'+
    '<div style="font-size:11.5px;color:#4A4A48;font-weight:600;margin-top:8px;text-align:center">'+esc(s[0])+'</div></div>').join('');
  const leg='<div style="display:flex;gap:16px;margin:2px 0 8px"><span style="font-size:11px;color:#4A4A48;font-weight:600"><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:#3D6FB8;margin-right:5px"></span>Afrontado</span><span style="font-size:11px;color:#4A4A48;font-weight:600"><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:#4ECC50;margin-right:5px"></span>Recuperado</span></div>';
  return '<section class="page" id="p5">'+head('Página 5 · Gestión de Mora','Gestión','de mora')+
  '<div class="content" style="gap:11px">'+
    '<div class="grid" style="grid-template-columns:repeat(5,1fr)">'+kpis+'</div>'+
    '<div class="grid" style="grid-template-columns:1.5fr 1fr;flex:1;align-items:stretch">'+
      '<div class="card"><div class="lbl">Evolución mes a mes · afrontado vs. recuperado</div>'+leg+'<div style="flex:1;display:flex;flex-direction:column;min-height:180px"><div style="position:relative;flex:1;margin-left:40px;border-bottom:2px solid #c9c7bd">'+gl+'<div style="position:absolute;inset:0;display:flex;align-items:flex-end;gap:10px;z-index:2">'+vbars+'</div></div><div style="display:flex;gap:10px;margin-left:40px;margin-top:6px">'+vmonths+'</div></div></div>'+
      '<div class="card"><div class="lbl" style="margin-bottom:12px">Afrontado y recuperado por acreedor</div><div style="flex:1;display:flex;flex-direction:column;justify-content:center">'+accr+'</div></div>'+
    '</div>'+
    '<div class="card"><div class="lbl" style="margin-bottom:4px">Mora por sector económico</div><div class="vbars" style="height:160px;align-items:flex-end;gap:22px">'+sb+'</div></div>'+
  '</div></section>';
}

const pt=buildDona(DATA.p5.tamano.map(x=>[tcase(x[0]),x[1]]),document.getElementById('dn-tam'));buildTabla(DATA.p5.tamano.map(x=>[tcase(x[0]),x[1]]),pt,document.getElementById('tb-tam'));

document.querySelectorAll('.msec').forEach(r=>{

function togEv(key,btn){
  const a=document.getElementById(key+'-act'),f=document.getElementById(key+'-full');
  const open=f.style.display==='none';
  f.style.display=open?'block':'none';a.style.display=open?'none':'block';
  btn.textContent=open?'Ver solo año en curso ▴':('Ver período completo (incl. '+(CY4-1)+') ▾');
}
function deoverlapPins(){
  const map=document.getElementById('map'); if(!map) return;
  const labels=[].slice.call(map.querySelectorAll('.pin>span'));
  labels.forEach(l=>l.style.top='2px');
  let it=labels.map(el=>({el,r:el.getBoundingClientRect()}));
  if(it.length && it[0].r.height===0) return;
  it.sort((a,b)=>(a.r.top-b.r.top)||(a.r.left-b.r.left));
  for(let i=0;i<it.length;i++){
    for(let j=0;j<i;j++){
      const a=it[j].r,b=it[i].r;
      if(!(b.left>a.right+3||b.right<a.left-3||b.top>a.bottom+2||b.bottom<a.top-2)){
        const shift=(a.bottom+3)-b.top, cur=parseFloat(it[i].el.style.top)||2;
        it[i].el.style.top=(cur+shift)+'px'; it[i].r=it[i].el.getBoundingClientRect();
      }
    }
  }
}
function showPage(n,btn){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById('p'+n).classList.add('active');document.querySelectorAll('.nav button').forEach(a=>a.classList.remove('active'));if(btn)btn.classList.add('active');window.scrollTo(0,0);if(n===4)setTimeout(deoverlapPins,30);}
window.addEventListener('resize',()=>{if(document.getElementById('p4').classList.contains('active'))deoverlapPins();});
window.addEventListener('beforeprint',()=>{document.querySelectorAll('.page').forEach(p=>p.style.display='flex');deoverlapPins();});
window.addEventListener('afterprint',()=>document.querySelectorAll('.page').forEach(p=>p.style.display=''));
